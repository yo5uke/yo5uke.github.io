meta:
  name: Yosuke Abe
  link:
    home: https://yo5uke.com/
    github: https://github.com/yo5uke
    bluesky: https://bsky.app/profile/5uke.bsky.social

logo:
  images:
    icon: assets/icons/favicon.ico
    icon-r: assets/icons/abe-r.png

# ---------------------------------------------------------------------------
# Color
# Palette entries are exposed as Sass variables ($brand-<name>) and CSS
# variables (--brand-<name>). `white` / `black` also feed Bootstrap's
# $white / $black. Theme colors take {light, dark} pairs so each color
# scheme gets its own value; styles/html/custom.scss builds on these.
# ---------------------------------------------------------------------------
color:
  palette:
    white:       "#ffffff"
    black:       "#0b0f19"
    # Neutrals
    slate-50:    "#f8fafc"
    slate-100:   "#f1f5f9"
    slate-200:   "#e2e8f0"
    slate-300:   "#cbd5e1"
    slate-400:   "#94a3b8"
    slate-500:   "#64748b"
    slate-600:   "#475569"
    slate-700:   "#334155"
    slate-800:   "#1e293b"
    slate-900:   "#0f172a"
    slate-950:   "#0b0f19"
    # Dark-mode surfaces
    navy-800:    "#17223b"
    navy-900:    "#131b2e"
    # Accents
    mint-300:    "#5eead4"
    mint-400:    "#2dd4bf"
    mint-600:    "#0d9488"
    mint-700:    "#0f766e"
    coral-400:   "#fb7185"
    coral-500:   "#f43f5e"
    # Status
    sky-400:     "#38bdf8"
    sky-500:     "#0ea5e9"
    emerald-400: "#34d399"
    emerald-500: "#10b981"
    amber-400:   "#fbbf24"
    amber-500:   "#f59e0b"
    orange-400:  "#fb923c"
    orange-500:  "#f97316"

  foreground:
    light: slate-800
    dark:  slate-300
  background:
    light: white
    dark:  slate-950
  primary:
    light: mint-600
    dark:  mint-400
  secondary:
    light: slate-500
    dark:  slate-400
  success:
    light: emerald-500
    dark:  emerald-400
  info:
    light: sky-500
    dark:  sky-400
  warning:
    light: amber-500
    dark:  amber-400
  danger:
    light: coral-500
    dark:  coral-400
  light: slate-50
  dark:  slate-900

# ---------------------------------------------------------------------------
# Typography
# ---------------------------------------------------------------------------
typography:
  fonts:
    - family: Plus Jakarta Sans
      source: google
      weight: [300, 400, 500, 600, 700, 800]
      style: [normal, italic]
    - family: Noto Sans JP
      source: google
      weight: [300, 400, 500, 600, 700]
      style: normal
    - family: JetBrains Mono
      source: google
      weight: [400, 500, 600, 700]
      style: [normal, italic]
  base:
    family: Plus Jakarta Sans, Noto Sans JP, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
    weight: 400
    size: 16px
    line-height: 1.7
  headings:
    family: Plus Jakarta Sans, Noto Sans JP, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
    weight: 700
    line-height: 1.3
    color:
      light: slate-900
      dark:  slate-50
  monospace:
    family: JetBrains Mono, monospace
  monospace-inline:
    weight: 500
    color:
      light: slate-900
      dark:  mint-300
    background-color:
      light: slate-100
      dark:  navy-900
  monospace-block:
    weight: 400
    size: 0.875rem
    line-height: 1.6
  link:
    weight: 500
    color: primary
    decoration: none

# ---------------------------------------------------------------------------
# Bootstrap variables shared by both color schemes.
# Scheme-dependent overrides live in styles/html/custom.scss.
# ---------------------------------------------------------------------------
defaults:
  bootstrap:
    defaults:
      # cosmo (light) disables rounding while darkly (dark) enables it.
      enable-rounded: true
      # Fonts come from `typography.fonts`; skip the base themes' own
      # Google Fonts imports (Source Sans Pro / Lato).
      web-font-path: false
