meta:
  name: Yosuke Abe
  link:
    home: https://yo5uke.com/
    github: https://github.com/yo5uke
    bluesky: https://bsky.app/profile/5uke.bsky.social

logo:
  images:
    icon: assets/icons/favicon.ico
    icon-r: assets/icons/abe-r.png

color:
  palette:
    white:        "#ffffff"
    black:        "#0b0f19"
    slate-50:     "#f8fafc"
    slate-100:    "#f1f5f9"
    slate-200:    "#e2e8f0"
    slate-300:    "#cbd5e1"
    slate-400:    "#94a3b8"
    slate-500:    "#64748b"
    slate-600:    "#475569"
    slate-700:    "#334155"
    slate-800:    "#1e293b"
    slate-900:    "#0f172a"
    slate-950:    "#0b0f19"
    mint-400:     "#2dd4bf"
    mint-500:     "#14b8a6"
    mint-600:     "#0d9488"
    mint-700:     "#0f766e"
    coral-400:    "#fb7185"
    coral-500:    "#f43f5e"
    cyan-500:     "#06b6d4"
    sky-500:      "#0ea5e9"
    emerald-500:  "#10b981"
    amber-500:    "#f59e0b"
    rose-500:     "#f43f5e"
    indigo-500:   "#6366f1"

  foreground: slate-800
  background: white
  primary:    mint-600
  secondary:  slate-500
  success:    emerald-500
  info:       sky-500
  warning:    amber-500
  danger:     rose-500
  light:      slate-50
  dark:       slate-900

typography:
  fonts:
    - family: Plus Jakarta Sans
      source: google
      weight: [400, 500, 600, 700, 800]
      style: normal
    - family: Noto Sans JP
      source: google
      weight: [400, 500, 600, 700]
      style: normal
    - family: JetBrains Mono
      source: google
      weight: [400, 500, 600]
      style: normal
  base:
    family: Plus Jakarta Sans, Noto Sans JP, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
    weight: 400
    size: 16px
    line-height: 1.7
  headings:
    family: Plus Jakarta Sans, Noto Sans JP, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
    weight: 700
    line-height: 1.3
  monospace-inline:
    family: JetBrains Mono, monospace
    color: "#0f172a"
    background-color: "#f1f5f9"
    weight: 500
  monospace-block:
    family: JetBrains Mono, monospace
    weight: 400
    size: 0.9rem
  link:
    weight: 500
    color: primary
    decoration: none

defaults:
  bootstrap:
    defaults:
      # matches typography.link.color's hover state (mint-700); brand.yml's
      # typography.link has no hover field, so this is set directly as a
      # Bootstrap Sass variable.
      link-hover-color: "#0f766e"
